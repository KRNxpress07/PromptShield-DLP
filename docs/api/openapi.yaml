openapi: 3.1.0
info:
  title: PromptShield API
  description: Academic text DLP gateway. Scan and chat share risk policy. Supported
    outbound string values in messages, names, tools/functions, schemas, stop/user/model/options
    and extra headers are inspected. Mask/warn content is sanitized and verified before
    egress; block never calls a provider. Images, audio, files, unknown multimodal
    content and encoded data-URI blobs are rejected. Provider credentials are server-owned;
    incoming gateway authentication is not prompt content. No output DLP, OCR, credential-liveness
    validation or semantic enterprise classifier.
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - health
      summary: Health
      description: 'Health check: verify Presidio reachability and return status with
        provider list.'
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /v1/chat/completions:
    post:
      tags:
      - proxy
      summary: Chat Completions
      description: Inspect complete supported textual outbound payload with bounded
        traversal. Reject unsupported modalities and credential-header overrides;
        preserve supported text-part/schema structure. Streaming uses the same pre-egress
        policy.
      operationId: chat_completions_v1_chat_completions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: pii_policy_violation, sanitization_verification_failed, unsupported_dlp_content,
            or validation error; no provider egress
        '503':
          description: Scanner unavailable or invalid response/sanitization contract;
            no egress
        '500':
          description: Invalid runtime DLP configuration or internal error; no unsafe
            fallback
      security:
      - GatewayKey: []
      parameters:
      - in: header
        name: x-provider
        required: false
        schema:
          type: string
          enum:
          - groq
          - openai
          - anthropic
          - together
          - gemini
          - mistral
          - deepinfra
          - xai
        description: Select an existing configured provider.
      - in: header
        name: x-model
        required: false
        schema:
          type: string
        description: Overrides body model; inspected before egress.
  /v1/scan:
    post:
      tags:
      - scan
      summary: Scan
      description: 'Scan raw text for sensitive content and return a risk decision.


        Always computes the redacted version (regardless of the eventual

        action) so the UI can preview what masking *would* produce even on a

        warn/block decision.'
      operationId: scan_v1_scan_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanResponse'
        '422':
          description: Validation or sanitization verification failure; no forwarding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '503':
          description: Scanner unavailable or invalid response/sanitization contract;
            no egress
        '500':
          description: Invalid runtime DLP configuration or internal error; no unsafe
            fallback
  /v1/documents/scan:
    post:
      tags:
      - documents
      summary: Scan Document
      description: Extract text from an uploaded file and scan it for sensitive content.
      operationId: scan_document_v1_documents_scan_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_scan_document_v1_documents_scan_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanResponse'
        '422':
          description: Validation or sanitization verification failure; no forwarding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '503':
          description: Scanner unavailable or invalid response/sanitization contract;
            no egress
        '500':
          description: Invalid runtime DLP configuration or internal error; no unsafe
            fallback
components:
  schemas:
    Body_scan_document_v1_documents_scan_post:
      properties:
        file:
          type: string
          format: binary
          title: File
      type: object
      required:
      - file
      title: Body_scan_document_v1_documents_scan_post
    ChatCompletionRequest:
      properties:
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
        messages:
          items:
            $ref: '#/components/schemas/ChatMessage'
          type: array
          minItems: 1
          title: Messages
        temperature:
          anyOf:
          - type: number
          - type: 'null'
          title: Temperature
        top_p:
          anyOf:
          - type: number
          - type: 'null'
          title: Top P
        max_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Tokens
        max_completion_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Completion Tokens
        stop:
          anyOf:
          - type: string
          - items:
              type: string
            type: array
          - type: 'null'
          title: Stop
        stream:
          type: boolean
          title: Stream
          default: false
        stream_options:
          anyOf:
          - type: object
          - type: 'null'
          title: Stream Options
        n:
          anyOf:
          - type: integer
          - type: 'null'
          title: N
        presence_penalty:
          anyOf:
          - type: number
          - type: 'null'
          title: Presence Penalty
        frequency_penalty:
          anyOf:
          - type: number
          - type: 'null'
          title: Frequency Penalty
        logit_bias:
          anyOf:
          - additionalProperties:
              type: number
            type: object
          - type: 'null'
          title: Logit Bias
        logprobs:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Logprobs
        top_logprobs:
          anyOf:
          - type: integer
          - type: 'null'
          title: Top Logprobs
        user:
          anyOf:
          - type: string
          - type: 'null'
          title: User
        seed:
          anyOf:
          - type: integer
          - type: 'null'
          title: Seed
        tools:
          anyOf:
          - items:
              type: object
            type: array
          - type: 'null'
          title: Tools
        tool_choice:
          anyOf:
          - type: string
          - type: object
          - type: 'null'
          title: Tool Choice
        functions:
          anyOf:
          - items:
              type: object
            type: array
          - type: 'null'
          title: Functions
        function_call:
          anyOf:
          - type: string
          - type: object
          - type: 'null'
          title: Function Call
        parallel_tool_calls:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Parallel Tool Calls
        response_format:
          anyOf:
          - type: object
          - type: 'null'
          title: Response Format
        reasoning_effort:
          anyOf:
          - type: string
          - type: 'null'
          title: Reasoning Effort
        thinking:
          anyOf:
          - type: object
          - type: 'null'
          title: Thinking
        top_k:
          anyOf:
          - type: integer
          - type: 'null'
          title: Top K
        extra_headers:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Extra Headers
        service_tier:
          anyOf:
          - type: string
          - type: 'null'
          title: Service Tier
      type: object
      required:
      - messages
      title: ChatCompletionRequest
      description: Incoming /v1/chat/completions request body (OpenAI-compatible).
    ChatMessage:
      properties:
        role:
          type: string
          title: Role
        content:
          anyOf:
          - type: string
          - items: {}
            type: array
          - type: 'null'
          title: Content
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
      type: object
      required:
      - role
      title: ChatMessage
      description: A single message in the OpenAI chat format.
    DLPViolation:
      properties:
        entity_type:
          type: string
          title: Entity Type
        start:
          type: integer
          title: Start
        end:
          type: integer
          title: End
        score:
          type: number
          title: Score
      type: object
      required:
      - entity_type
      - start
      - end
      - score
      title: DLPViolation
      description: A single PII entity detected by the DLP scan.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ScanRequest:
      properties:
        text:
          type: string
          maxLength: 200000
          minLength: 1
          title: Text
        source:
          type: string
          title: Source
          default: prompt
      type: object
      required:
      - text
      title: ScanRequest
    ScanResponse:
      properties:
        request_id:
          type: string
          title: Request Id
        action:
          type: string
          title: Action
        risk_level:
          type: string
          title: Risk Level
        risk_score:
          type: integer
          title: Risk Score
        reason:
          type: string
          title: Reason
        entity_types_detected:
          items:
            type: string
          type: array
          title: Entity Types Detected
        violations:
          items:
            $ref: '#/components/schemas/DLPViolation'
          type: array
          title: Violations
        redacted_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Redacted Text
        original_length:
          type: integer
          title: Original Length
        dlp_latency_ms:
          type: integer
          title: Dlp Latency Ms
      type: object
      required:
      - request_id
      - action
      - risk_level
      - risk_score
      - reason
      - entity_types_detected
      - violations
      - redacted_text
      - original_length
      - dlp_latency_ms
      title: ScanResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    GatewayKey:
      type: http
      scheme: bearer
      description: Gateway authentication key; distinct from server-owned provider
        credentials.
servers:
- url: http://localhost:8000
